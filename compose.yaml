services:
  db:
    image: postgres:16
    container_name: mini-twitter-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
